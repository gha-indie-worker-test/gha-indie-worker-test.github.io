name: ores-compose version exact-head proof

on:
  pull_request:
    paths:
      - ".github/workflows/ores-compose-version-proof.yml"

permissions:
  contents: read

jobs:
  exact_head:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: f8e2df74c45495f635217507d319f8a3f06718de
          persist-credentials: false
      - name: Verify exact production head
        run: test "$(git rev-parse HEAD)" = "f8e2df74c45495f635217507d319f8a3f06718de"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --test cli_version
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Direct binary assertions
        run: |
          cargo build --locked --bin ores-compose
          version="$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$(target/debug/ores-compose --version)" = "ores-compose $version"
          test "$(target/debug/ores-compose -V)" = "ores-compose $version"
